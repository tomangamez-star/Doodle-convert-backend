services:
  - type: web
    name: doodle-game-hub-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: GAME_BASE_URL
        sync: false
      - key: DOODLE_GAME_SHORT_NAME
        value: doodle_covert
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: OWNER_ID
        sync: false
